<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Archive — Dead Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16130f; --paper: #efe6d0; --red: #8a2f2b;
    --brass: #c9a86a; --mute: #8d8271; --line: #3a332a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "EB Garamond", Georgia, serif;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,168,106,0.06), transparent 55%),
      var(--ink);
    color: var(--paper); margin: 0; padding: 0 0 4rem;
  }
  .wrap { max-width: 660px; margin: 0 auto; padding: 0 1rem; }
  .masthead { border-bottom: 3px double var(--line); padding: 1.4rem 0 0.9rem; margin-bottom: 1.3rem; }
  .brand { font-family: "Special Elite", monospace; font-size: 0.7rem;
    letter-spacing: 0.35em; color: var(--brass); text-transform: uppercase; }
  h1 { font-family: "Special Elite", monospace; font-size: 1.5rem; margin: 0.25rem 0 0; }
  .red-string { height: 2px; background: linear-gradient(90deg, transparent, var(--red), transparent); margin-top: 0.6rem; }
  .sub { color: var(--mute); font-style: italic; font-size: 0.9rem; margin: 0.7rem 0 0; }

  .case {
    position: relative;
    background: linear-gradient(170deg, #e9dfc8, #d8caab);
    color: #2c2519;
    border-radius: 3px;
    padding: 1rem 1.2rem 1rem 1.4rem;
    margin-bottom: 1rem;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(0,0,0,0.5);
    transition: transform .15s;
    border-left: 5px solid var(--red);
    animation: rise .4s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .case:nth-child(odd) { transform: rotate(-0.3deg); }
  .case:nth-child(even) { transform: rotate(0.3deg); }
  .case:hover { transform: rotate(0) translateY(-2px); }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .case .code {
    float: right; font-family: "Special Elite", monospace;
    color: var(--red); letter-spacing: 0.3em; font-size: 0.95rem;
  }
  .case .ct { font-family: "Special Elite", monospace; font-size: 1.02rem; }
  .case .cm { color: #6d5c3e; font-size: 0.83rem; margin-top: 0.35rem; line-height: 1.55; font-style: italic; }
  .case .players { margin-top: 0.5rem; font-size: 0.8rem; }
  .p-open { color: #8a6a20; } .p-done { color: #4a7a3a; font-weight: 600; }
  #status { color: var(--mute); text-align: center; padding: 2.5rem 0; font-style: italic; }
  .foot { text-align: center; margin-top: 1.6rem; }
  .foot a { color: var(--mute); font-size: 0.85rem; text-decoration: none; }
  .foot a:hover { color: var(--paper); text-decoration: underline; }

  .join-panel {
    background: linear-gradient(175deg, #221d17, #1c1813);
    border: 1px solid var(--line); border-left: 5px solid var(--red);
    border-radius: 3px;
    padding: 1rem 1.1rem; margin: -0.4rem 0 1rem;
    box-shadow: 0 5px 16px rgba(0,0,0,0.5);
    animation: rise .25s ease both;
  }
  .join-panel .jp-title {
    font-family: "Special Elite", monospace; font-size: 0.72rem;
    letter-spacing: 0.25em; text-transform: uppercase; color: var(--brass);
    margin-bottom: 0.7rem;
  }
  .join-panel input {
    width: 100%; padding: 0.65rem 0.75rem; background: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
    color: var(--paper); font-family: inherit; font-size: 1rem;
  }
  .join-panel input::placeholder { color: #857a66; }
  .join-panel .jp-hint { font-size: 0.78rem; color: var(--mute); font-style: italic; margin: 0.35rem 0 0; }
  .join-panel .jp-err { color: #d98a85; font-size: 0.85rem; font-style: italic;
    margin: 0.45rem 0 0; min-height: 1.1rem; }
  .join-panel .jp-actions { display: flex; gap: 0.6rem; margin-top: 0.7rem; flex-wrap: wrap; }
  .stamp-btn {
    flex: 1 1 12rem;
    font-family: "Special Elite", monospace;
    background: var(--red); color: var(--paper);
    padding: 0.7rem; border: none; border-radius: 3px;
    font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 3px 0 #5c1f1c, 0 5px 12px rgba(0,0,0,0.4);
    transition: transform .1s, box-shadow .1s;
  }
  .stamp-btn:hover { transform: translateY(1px); box-shadow: 0 2px 0 #5c1f1c, 0 4px 10px rgba(0,0,0,0.4); }
  .ghost-btn {
    flex: 0 1 auto;
    font-family: "Special Elite", monospace;
    background: transparent; color: var(--mute);
    padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-radius: 3px;
    font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--paper); border-color: var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div class="brand">Dead Air · Homicide Division</div>
    <h1>Case Archive</h1>
    <div class="red-string"></div>
    <p class="sub">Every mystery ever filed. Tap a folder to take the case.</p>
  </div>
  <div id="status">Dusting off the files…</div>
  <div id="cases"></div>
  <div class="foot"><a href="index.html">← Back to the lobby</a></div>
</div>

<script src="../../shared/api.js"></script>
<script>
  // Shared detective-name validation rules (mirrored in index.html).
  function validateDetectiveName(raw) {
    const name = (raw || "").trim();
    if (!name) return { ok: false, error: "Enter your detective name." };
    if (name.length > 24) return { ok: false, error: "Detective name must be 24 characters or fewer." };
    if (name.includes("/") || name.includes("."))
      return { ok: false, error: "Detective name can't contain / or . characters." };
    if (!/^[\p{L}\p{N} \-_']+$/u.test(name))
      return { ok: false, error: "Detective name may only use letters, numbers, spaces, and - _ ' characters." };
    return { ok: true, name };
  }

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // Handles Firestore Timestamps, strings, numbers, and junk.
  function formatFiledDate(v) {
    try {
      let d = null;
      if (v && typeof v.toDate === "function") d = v.toDate();
      else if (typeof v === "string" || typeof v === "number") d = new Date(v);
      if (!d || isNaN(d.getTime())) return "date unknown";
      return d.toLocaleString();
    } catch (e) {
      return "date unknown";
    }
  }

  let joinPanel = null;

  function closeJoin() {
    if (joinPanel) { joinPanel.remove(); joinPanel = null; }
  }

  function openJoin(code, card) {
    if (joinPanel && joinPanel.dataset.code === code) { closeJoin(); return; }
    closeJoin();

    const panel = el("div", "join-panel");
    panel.dataset.code = code;
    panel.appendChild(el("div", "jp-title", "Case " + code + " — sign in, detective"));

    const input = document.createElement("input");
    input.maxLength = 24;
    input.placeholder = "Your detective name";
    input.setAttribute("aria-label", "Your detective name");
    panel.appendChild(input);

    panel.appendChild(el("div", "jp-hint",
      "Use the SAME name to resume an open investigation."));
    const err = el("div", "jp-err");
    err.setAttribute("role", "alert");
    panel.appendChild(err);

    const actions = el("div", "jp-actions");
    const begin = el("button", "stamp-btn", "🔍 Begin Investigation");
    const cancel = el("button", "ghost-btn", "Cancel");
    actions.append(begin, cancel);
    panel.appendChild(actions);

    const submit = () => {
      const check = validateDetectiveName(input.value);
      if (!check.ok) { err.textContent = "⚠️ " + check.error; input.focus(); return; }
      location.href = `game.html?case=${encodeURIComponent(code)}&detective=${encodeURIComponent(check.name)}`;
    };
    begin.addEventListener("click", submit);
    cancel.addEventListener("click", () => { closeJoin(); card.focus(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); submit(); }
      if (e.key === "Escape") { closeJoin(); card.focus(); }
    });

    card.after(panel);
    joinPanel = panel;
    input.focus();
  }

  async function boot() {
    try {
      await SandboxAPI.firebaseApp();
      const db = firebase.firestore();
      const snap = await db.collection("cases").orderBy("createdAt", "desc").get();
      if (snap.empty) {
        document.getElementById("status").textContent =
          "No cases on file — generate your first mystery from the lobby.";
        return;
      }
      document.getElementById("status").style.display = "none";
      const box = document.getElementById("cases");

      for (const doc of snap.docs) {
        const c = doc.data();
        const div = el("div", "case");
        div.tabIndex = 0;
        div.setAttribute("role", "button");
        div.setAttribute("aria-label", "Take case " + doc.id);

        div.appendChild(el("span", "code", doc.id));
        div.appendChild(el("div", "ct", c.title || "Untitled case"));
        div.appendChild(el("div", "cm",
          "Victim: " + (c.victim && c.victim.name ? c.victim.name : "?") +
          " · " + (c.suspects ? c.suspects.length : "?") + " suspects · filed " +
          formatFiledDate(c.createdAt)));

        try {
          const players = await db.collection("cases").doc(doc.id).collection("players").get();
          if (!players.empty) {
            const row = el("div", "players");
            row.append("🕵️ ");
            players.docs.forEach((p, i) => {
              if (i > 0) row.append(" · ");
              const done = !!p.data().accusation;
              row.appendChild(el("span", done ? "p-done" : "p-open",
                p.id + (done ? " ✓ closed" : " … open")));
            });
            div.appendChild(row);
          }
        } catch (e) { /* players list best-effort */ }

        div.addEventListener("click", () => openJoin(doc.id, div));
        div.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openJoin(doc.id, div); }
        });
        box.appendChild(div);
      }
    } catch (e) {
      document.getElementById("status").textContent = "❌ " + e.message;
    }
  }

  boot();
</script>
</body>
</html>
