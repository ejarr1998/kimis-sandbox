<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕵️ Dead Air — Lobby</title>
<style>
  body { font-family: Georgia, serif; background: #2a2724; color: #e8e2d8; margin: 0;
         display: flex; justify-content: center; align-items: center; min-height: 100vh;
         padding: 1.5rem 1rem; box-sizing: border-box; }
  .card { width: 100%; max-width: 520px; background: #35312c; border: 1px solid #4a443c;
          border-radius: 14px; padding: 2rem; box-shadow: 0 8px 30px rgba(0,0,0,0.35); }
  h1 { font-size: 1.9rem; margin: 0 0 0.2rem; text-align: center; }
  .sub { color: #a39a86; text-align: center; margin-bottom: 1.6rem; font-size: 0.9rem; line-height: 1.5; }
  h2 { font-size: 1rem; margin: 1.4rem 0 0.5rem; color: #cbbf9f; }
  input { width: 100%; box-sizing: border-box; padding: 0.7rem; background: #2a2724;
          border: 1px solid #4a443c; border-radius: 8px; color: #e8e2d8; font-size: 1rem; }
  button { width: 100%; margin-top: 0.7rem; padding: 0.8rem; background: #cbbf9f; color: #2a2724;
           border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  button:hover { background: #ddd2b2; }
  button:disabled { opacity: 0.5; cursor: wait; }
  #status { margin-top: 1.2rem; text-align: center; color: #a39a86; font-size: 0.9rem;
            min-height: 1.4rem; line-height: 1.5; }
  .divider { text-align: center; color: #6a6255; margin: 1.6rem 0 0.4rem; font-size: 0.8rem;
             text-transform: uppercase; letter-spacing: 0.1em; }
  .code-input { text-transform: uppercase; letter-spacing: 0.4em; text-align: center;
                font-size: 1.3rem; }
  a { color: #a39a86; }
  .back { display: block; text-align: center; margin-top: 1.4rem; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="card">
  <h1>🕵️ Dead Air</h1>
  <p class="sub">An asynchronous murder mystery.<br>
     Every detective gets the same case — but your interrogations are your own.
     Compare notes when it's over.</p>

  <h2>Open a new case file</h2>
  <button id="host" onclick="hostCase()">🖋 Generate a new mystery</button>

  <div class="divider">— or —</div>

  <h2>Join an existing case</h2>
  <input id="code" class="code-input" maxlength="4" placeholder="CODE">
  <input id="name" placeholder="Your detective name" style="margin-top:0.5rem">
  <button onclick="joinExisting()">🔍 Begin investigation</button>

  <div id="status"></div>
  <a class="back" href="../../index.html">← Back to the sandbox</a>
</div>

<script src="../../shared/api.js"></script>
<script src="case-engine.js"></script>
<script>
  const status = (t) => document.getElementById("status").innerHTML = t;

  async function hostCase() {
    const btn = document.getElementById("host");
    btn.disabled = true;
    try {
      let caseFile = await CaseEngine.generateCase(status);
      const result = await CaseEngine.validateAndPatch(caseFile, status);
      caseFile = result.caseFile;
      await CaseEngine.generatePortraits(caseFile, status);
      status("🔒 Locking the case file…");
      const code = await CaseEngine.saveCase(caseFile);
      status(`✅ Case ready! Your join code is <b style="font-size:1.3rem;letter-spacing:0.3em">${code}</b><br>
              Share it with a friend, then enter it below with your detective name.`);
      document.getElementById("code").value = code;
      document.getElementById("name").focus();
    } catch (e) {
      status("❌ " + e.message + "<br>(Check keys on the Settings page and try again.)");
    } finally {
      btn.disabled = false;
    }
  }

  function joinExisting() {
    const code = document.getElementById("code").value.trim().toUpperCase();
    const name = document.getElementById("name").value.trim();
    if (code.length !== 4) { status("⚠️ Enter the 4-letter case code."); return; }
    if (!name) { status("⚠️ Enter your detective name."); return; }
    location.href = `game.html?case=${encodeURIComponent(code)}&detective=${encodeURIComponent(name)}`;
  }
</script>
</body>
</html>
