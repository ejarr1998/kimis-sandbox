<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Kimi's Sandbox</title>
<style>
  body { font-family: Georgia, serif; background: #faf8f5; color: #3a3630;
         display: flex; justify-content: center; padding: 2rem 1rem; margin: 0; }
  .card { width: 100%; max-width: 600px; background: #fff; padding: 2rem;
          border: 1px solid #e8e2d8; border-radius: 12px;
          box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  h1 { font-size: 1.6rem; margin-top: 0; }
  h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em;
       color: #8a7f68; margin: 2rem 0 0.5rem; border-bottom: 1px solid #e8e2d8;
       padding-bottom: 0.3rem; }
  label { display: block; margin: 1rem 0 0.3rem; font-weight: bold; font-size: 0.95rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 0.6rem;
          border: 1px solid #d8d0c0; border-radius: 8px; font-size: 0.95rem;
          font-family: monospace; }
  button { margin-top: 1.5rem; padding: 0.7rem 1.6rem; background: #8a7f68;
          color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  button:hover { background: #6f6552; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .sync-btn { margin-top: 0.6rem; margin-right: 0.5rem; }
  .note { color: #7a7264; font-size: 0.85rem; line-height: 1.5; }
  .hint { font-weight: normal; color: #a39a86; font-size: 0.8rem; }
  #status { margin-top: 1rem; color: #4a7a4a; }
  #sync-status { margin-top: 0.7rem; font-size: 0.9rem; }
  a { color: #8a7f68; }
</style>
</head>
<body>
<div class="card">
  <h1>🔑 Sandbox Settings</h1>
  <p class="note">Keys are stored <b>in this browser</b> (localStorage) and never committed to the repo.
     Use cloud sync below to carry them across devices.</p>

  <h2>☁️ Sync across devices</h2>
  <label for="passphrase">Sync passphrase <span class="hint">— encrypts keys before upload; never stored</span></label>
  <input id="passphrase" type="password" placeholder="pick a passphrase you'll remember">
  <button class="sync-btn" id="push-btn" onclick="pushKeys()">⬆ Upload (encrypted)</button>
  <button class="sync-btn" id="pull-btn" onclick="pullKeys()">⬇ Download to this device</button>
  <div id="sync-status" class="note"></div>

  <h2>Core</h2>
  <label for="k-claude">Claude (Anthropic) <span class="hint">sk-ant-… · console.anthropic.com</span></label>
  <input id="k-claude" type="password" placeholder="sk-ant-...">

  <label for="k-grok">Grok (xAI) <span class="hint">xai-… · console.x.ai</span></label>
  <input id="k-grok" type="password" placeholder="xai-...">

  <label for="k-eleven">ElevenLabs (TTS + SFX) <span class="hint">UUID · elevenlabs.io → profile</span></label>
  <input id="k-eleven" type="password" placeholder="...">

  <h2>More brains</h2>
  <label for="k-gemini">Google Gemini <span class="hint">AIza… · aistudio.google.com</span></label>
  <input id="k-gemini" type="password" placeholder="AIza...">

  <label for="k-groq">Groq (fast inference + Whisper) <span class="hint">gsk_… · console.groq.com</span></label>
  <input id="k-groq" type="password" placeholder="gsk_...">

  <label for="k-deepseek">DeepSeek <span class="hint">sk-… · platform.deepseek.com</span></label>
  <input id="k-deepseek" type="password" placeholder="sk-...">

  <label for="k-mistral">Mistral <span class="hint">console.mistral.ai</span></label>
  <input id="k-mistral" type="password" placeholder="...">

  <h2>Media &amp; models</h2>
  <label for="k-replicate">Replicate <span class="hint">r8_… · replicate.com</span></label>
  <input id="k-replicate" type="password" placeholder="r8_...">

  <label for="k-fal">fal.ai <span class="hint">fal.ai → dashboard</span></label>
  <input id="k-fal" type="password" placeholder="...">

  <h2>Voice &amp; ears</h2>
  <label for="k-deepgram">Deepgram (speech-to-text) <span class="hint">console.deepgram.com</span></label>
  <input id="k-deepgram" type="password" placeholder="...">

  <h2>Search &amp; knowledge</h2>
  <label for="k-tavily">Tavily (web search) <span class="hint">tvly-… · tavily.com</span></label>
  <input id="k-tavily" type="password" placeholder="tvly-...">

  <label for="k-brave">Brave Search <span class="hint">BSA… · brave.com/search/api</span></label>
  <input id="k-brave" type="password" placeholder="BSA...">

  <h2>Advanced</h2>
  <label for="k-firebase">Firebase config override (JSON) <span class="hint">optional — already baked into the code</span></label>
  <textarea id="k-firebase" rows="4" placeholder='{"apiKey":"...",...}'></textarea>

  <button onclick="save()">Save all</button>
  <div id="status"></div>
  <p class="note" style="margin-top:1.5rem"><a href="index.html">← Back to the hub</a></p>
</div>
<script src="shared/api.js"></script>
<script>
  const fields = {
    claude: "k-claude", grok: "k-grok", elevenlabs: "k-eleven",
    gemini: "k-gemini", groq: "k-groq", deepseek: "k-deepseek",
    mistral: "k-mistral", replicate: "k-replicate", fal: "k-fal",
    deepgram: "k-deepgram", tavily: "k-tavily", brave: "k-brave"
  };
  function loadFields() {
    for (const [name, id] of Object.entries(fields)) {
      const v = localStorage.getItem("sandbox_key_" + name);
      if (v) document.getElementById(id).value = v;
    }
    const fb = localStorage.getItem("sandbox_firebase_config");
    if (fb) document.getElementById("k-firebase").value = fb;
  }
  loadFields();

  function save() {
    for (const [name, id] of Object.entries(fields)) {
      const v = document.getElementById(id).value.trim();
      if (v) localStorage.setItem("sandbox_key_" + name, v);
      else localStorage.removeItem("sandbox_key_" + name);
    }
    const fbv = document.getElementById("k-firebase").value.trim();
    if (fbv) {
      try { JSON.parse(fbv); localStorage.setItem("sandbox_firebase_config", fbv); }
      catch { document.getElementById("status").textContent = "⚠️ Firebase config is not valid JSON — not saved."; return; }
    } else localStorage.removeItem("sandbox_firebase_config");
    document.getElementById("status").textContent = "✅ All keys saved to this browser.";
  }

  // ---------- encrypted cloud sync (AES-GCM + PBKDF2, passphrase never leaves the device) ----------
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function deriveKey(passphrase, salt) {
    const base = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }

  function collectKeys() {
    save(); // make sure localStorage reflects the form
    const bundle = {};
    for (const name of Object.keys(fields)) {
      const v = localStorage.getItem("sandbox_key_" + name);
      if (v) bundle[name] = v;
    }
    return bundle;
  }

  function getPassphrase() {
    const p = document.getElementById("passphrase").value;
    if (!p) { document.getElementById("sync-status").textContent = "⚠️ Enter a sync passphrase first."; return null; }
    return p;
  }

  async function pushKeys() {
    const p = getPassphrase(); if (!p) return;
    const btn = document.getElementById("push-btn"); btn.disabled = true;
    const st = document.getElementById("sync-status");
    st.textContent = "Encrypting & uploading…";
    try {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(p, salt);
      const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key,
        enc.encode(JSON.stringify(collectKeys())));
      await SandboxAPI.firebaseApp();
      await firebase.firestore().collection("sync").doc("keys").set({
        salt: b64(salt), iv: b64(iv), data: b64(data),
        updatedAt: new Date().toISOString()
      });
      st.textContent = "✅ Uploaded (encrypted). On your other device: enter the same passphrase → Download.";
    } catch (e) { st.textContent = "❌ " + e.message; }
    btn.disabled = false;
  }

  async function pullKeys() {
    const p = getPassphrase(); if (!p) return;
    const btn = document.getElementById("pull-btn"); btn.disabled = true;
    const st = document.getElementById("sync-status");
    st.textContent = "Downloading & decrypting…";
    try {
      await SandboxAPI.firebaseApp();
      const snap = await firebase.firestore().collection("sync").doc("keys").get();
      if (!snap.exists) throw new Error("No synced keys found — upload from your other device first.");
      const d = snap.data();
      const key = await deriveKey(p, unb64(d.salt));
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(d.iv) }, key, unb64(d.data));
      const bundle = JSON.parse(dec.decode(plain));
      for (const [name, v] of Object.entries(bundle)) {
        localStorage.setItem("sandbox_key_" + name, v);
      }
      loadFields();
      st.textContent = "✅ " + Object.keys(bundle).length + " keys restored to this device (synced " + d.updatedAt + ").";
    } catch (e) {
      st.textContent = "❌ " + (e.name === "OperationError" ? "Wrong passphrase (or corrupted data)." : e.message);
    }
    btn.disabled = false;
  }
</script>
</body>
</html>
